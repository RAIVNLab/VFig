### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 262144 # 512 * 512
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
freeze_vision_tower: false #default true
freeze_multi_modal_projector: false #default true
freeze_language_model: false #default false
### dataset
dataset: finetune_data_starvector_new, finetune_data_molmo_new, finetune_data_synthetic_svg_new, finetune_data_arxiv_p2f_new, finetune_data_arxiv_new
template: qwen2_vl
cutoff_len: 8192
max_samples: 90000
overwrite_cache: true
preprocessing_num_workers: 32
dataloader_num_workers: 24

### output
output_dir: output/xxx
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.01
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
