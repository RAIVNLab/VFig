### model
# Base model must match the model family used to train the stage1 adapter.
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
# Load LoRA adapter weights from your previous run (continue training the adapter on new data)
adapter_name_or_path: xxx
image_max_pixels: 262144 # 512 * 512
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_target: all

### dataset
dataset: finetune_data_arxiv_p2f_new, finetune_data_arxiv_new
template: qwen3_vl_nothink
cutoff_len: 8192
max_samples: 90000
overwrite_cache: true
preprocessing_num_workers: 32
dataloader_num_workers: 24

### output
output_dir: output/xxx
logging_steps: 10
save_steps: 250
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
# IMPORTANT:
# - Do NOT set resume_from_checkpoint for this use case.
#   That resumes trainer_state/global_step and can skip data / finish immediately.
#resume_from_checkpoint: /path/to/checkpoint_dir
#resume_lora_only: true

### eval
val_size: 0.01
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
